services:
  - type: web
    name: aaharai-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-flash-latest
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OFF_BASE_URL
        value: https://world.openfoodfacts.org/api/v2/product
      - key: OFF_USER_AGENT
        value: AaharAi/1.0 (founder@asiverticals.me)
      - key: OFF_TIMEOUT_SECONDS
        value: "6.0"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://asiverticals.me"]'
