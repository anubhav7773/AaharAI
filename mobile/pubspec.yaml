name: aahar_ai
description: "AI-driven food transparency and nutritional intelligence engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.0.1

  # Network & Caching
  dio: ^5.4.3+1
  path_provider: ^2.1.3

  # Hardware, Camera & Scanning
  mobile_scanner: ^5.1.1
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  image: ^4.1.7

  # UI Utilities & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.2.5
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#F2F9F4"
  adaptive_icon_foreground: "assets/icons/app_logo_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
